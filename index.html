<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
</head>
<body>

    <h1>Student Form</h1>

    <form>
        
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <label>Q1. 2 + 2 kya hai?</label><br>
        <input type="radio" id="q1a" name="q1" value="3">
        <label for="q1a">3</label><br>
        <input type="radio" id="q1b" name="q1" value="4">
        <label for="q1b">4</label><br><br>

        <label>Q2. Pakistan ka capital kya hai?</label><br>
        <input type="radio" id="q2a" name="q2" value="Karachi">
        <label for="q2a">Karachi</label><br>
        <input type="radio" id="q2b" name="q2" value="Lahore">
        <label for="q2b">Lahore</label><br>
        <input type="radio" id="q2c" name="q2" value="Islamabad">
        <label for="q2c">Islamabad</label><br>
        <input type="radio" id="q2d" name="q2" value="Peshawar">
        <label for="q2d">Peshawar</label><br><br>

        <label>Q3. Computer ka brain kisko kehte hain?</label><br>
        <input type="radio" id="q3a" name="q3" value="RAM">
        <label for="q3a">RAM</label><br>
        <input type="radio" id="q3b" name="q3" value="CPU">
        <label for="q3b">CPU</label><br>
        <input type="radio" id="q3c" name="q3" value="Hard Disk">
        <label for="q3c">Hard Disk</label><br><br>

        <label>Q4. HTML ka full form kya hai?</label><br>
        <input type="radio" id="q4a" name="q4" value="Hyper Text Markup Language">
        <label for="q4a">Hyper Text Markup Language</label><br>
        <input type="radio" id="q4b" name="q4" value="Home Tool Markup Language">
        <label for="q4b">Home Tool Markup Language</label><br>
        <input type="radio" id="q4c" name="q4" value="Hyperlinks and Text Markup Language">
        <label for="q4c">Hyperlinks and Text Markup Language</label><br><br>

        <label>Q5. Website design karne ke liye kis language ka istemal hota hai?</label><br>
        <input type="radio" id="q5a" name="q5" value="HTML">
        <label for="q5a">HTML</label><br>
        <input type="radio" id="q5b" name="q5" value="CSS">
        <label for="q5b">CSS</label><br>
        <input type="radio" id="q5c" name="q5" value="JavaScript">
        <label for="q5c">JavaScript</label><br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
